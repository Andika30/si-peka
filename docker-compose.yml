version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: ./docker/app.dockerfile
    container_name: peka_app
    working_dir: /srv/peka
    env_file:
      - .env
    volumes:
      - ./:/srv/peka
    networks:
      - proxy_network

  peka_nginx:
    image: nginx:1.25-alpine
    container_name: peka_nginx
    environment:
      - VIRTUAL_HOST=peka.meambo.id
      - LETSENCRYPT_HOST=peka.meambo.id
      - VIRTUAL_PORT=80
    volumes:
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
    networks:
      - proxy_network
    depends_on:
      - app

networks:
  proxy_network:
    external: true
